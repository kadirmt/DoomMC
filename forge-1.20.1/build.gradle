plugins {
	id 'dev.architectury.loom' version '1.7.435'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'doommc-forge-1.20.1'
}

// the engine is pure Java and shared by every loader module
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')

dependencies {
	minecraft "com.mojang:minecraft:1.20.1"
	mappings loom.officialMojangMappings()
	forge "net.minecraftforge:forge:1.20.1-47.4.10"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
